<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FishTI - 海洋人格共振测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        
        :root {
            --ocean-dark: #000814;
            --ocean-mid: #001d3d;
            --ocean-bright: #00b4d8;
        }

        body {
            background-color: var(--ocean-dark);
            color: #e0f2fe;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 海雪背景 */
        #marine-snow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snow-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(1px);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(110vh) translateX(30px); opacity: 0; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-option {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-option:active {
            background: rgba(0, 180, 216, 0.3);
            transform: scale(0.98);
        }

        #result-card {
            background: linear-gradient(180deg, #001d3d 0%, #000814 100%);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
        }

        .typewriter {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--ocean-bright);
            animation: typing 2s steps(20, end), blink .75s step-end infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--ocean-bright) } }

        .hidden { display: none !important; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div id="marine-snow"></div>

    <div class="fixed top-6 right-6 z-50">
        <button onclick="toggleMusic()" id="music-btn" class="glass w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-lg">🔇</button>
    </div>

    <div id="start-screen" class="relative z-10 text-center max-w-sm">
        <div class="mb-6 inline-block animate-bounce text-7xl">🐋</div>
        <h1 class="text-7xl font-bold mb-4 tracking-tighter text-cyan-400" style="font-family: 'ZCOOL KuaiLe'">FishTI</h1>
        <p class="text-blue-200 opacity-80 mb-12 tracking-widest text-sm">海洋人格共振 · 演化心理诊断</p>
        <button onclick="startQuiz()" class="bg-cyan-500 hover:bg-cyan-400 text-white px-16 py-4 rounded-full text-xl font-bold shadow-[0_0_30px_rgba(6,182,212,0.4)] transition-all">潜入意识深海</button>
    </div>

    <div id="quiz-container" class="relative z-10 w-full max-w-lg hidden">
        <div class="mb-6">
            <div class="flex justify-between text-[10px] text-cyan-400 mb-2 uppercase font-mono tracking-widest">
                <span id="q-depth">DEPTH: 0M</span>
                <span>Progress: <span id="q-percent">0%</span></span>
            </div>
            <div class="w-full bg-white/10 h-1 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-cyan-400 h-full transition-all duration-500 w-0"></div>
            </div>
        </div>
        
        <div class="glass rounded-3xl p-8 shadow-2xl border border-white/20">
            <h2 id="q-text" class="text-xl font-medium mb-8 leading-relaxed h-20 flex items-center">正在同步海洋信号...</h2>
            <div id="options-container" class="space-y-4"></div>
        </div>
    </div>

    <div id="result-screen" class="relative z-10 w-full max-w-lg hidden py-4">
        <div id="result-card" class="mx-auto p-8 border border-white/20 relative">
            <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl rotate-12">🌊</div>
            
            <div class="mb-6">
                <p class="text-[10px] tracking-[0.3em] text-cyan-400 uppercase opacity-70 mb-1">Diagnosis Report</p>
                <div class="flex items-end justify-between">
                    <h2 id="fish-name" class="text-3xl font-bold text-white tracking-tighter"></h2>
                    <div id="fish-emoji" class="text-5xl pb-1"></div>
                </div>
            </div>

            <div class="mb-4 aspect-square max-w-[280px] mx-auto">
                <canvas id="radarChart"></canvas>
            </div>

            <div class="space-y-4 mb-6">
                <div class="bg-white/5 p-4 rounded-2xl border-l-2 border-cyan-400">
                    <p id="fish-desc" class="text-sm italic leading-relaxed text-blue-50"></p>
                </div>
                <div class="bg-black/40 p-4 rounded-2xl">
                    <p class="text-[10px] text-cyan-500 font-bold mb-1 tracking-widest">🐚 演化科学笔记</p>
                    <p id="fish-science" class="text-xs text-blue-200/70 leading-relaxed"></p>
                </div>
            </div>

            <div class="flex justify-between items-end border-t border-white/10 pt-6">
                <div class="text-[9px] text-white/30 font-mono leading-tight">
                    <p>TYPE: <span id="fish-class" class="text-white/60"></span></p>
                    <p>HABITAT: <span id="fish-depth" class="text-white/60"></span></p>
                    <p class="mt-2 uppercase tracking-tighter">Verified by FishTI Laboratory</p>
                </div>
                <div class="text-right">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=FishTI&bgcolor=001d3d&color=ffffff" class="w-12 h-12 ml-auto mb-1 border border-white/20 p-1">
                    <p class="text-[8px] opacity-30">扫码探索你的深海灵魂</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-6 px-4">
            <button onclick="saveCard()" class="py-4 bg-cyan-600 hover:bg-cyan-500 rounded-2xl font-bold text-sm shadow-xl transition-all">保存卡片</button>
            <button onclick="location.reload()" class="py-4 bg-white/10 hover:bg-white/20 rounded-2xl font-bold text-sm transition-all">重测一次</button>
        </div>
        <p class="text-center text-[10px] opacity-30 mt-6 italic">保存图片后可分享至朋友圈</p>
    </div>

    <audio id="bgm" loop src="https://assets.mixkit.co/music/preview/mixkit-underwater-world-983.mp3"></audio>
    <audio id="bubble-sfx" src="https://assets.mixkit.co/sfx/preview/mixkit-liquid-bubble-3000.mp3"></audio>

    <script>
        // 1. 粒子系统
        function initSnow() {
            const container = document.getElementById('marine-snow');
            for (let i = 0; i < 40; i++) {
                const snow = document.createElement('div');
                snow.className = 'snow-particle';
                const size = Math.random() * 3 + 1 + 'px';
                snow.style.width = size;
                snow.style.height = size;
                snow.style.left = Math.random() * 100 + '%';
                snow.style.animationDuration = Math.random() * 10 + 8 + 's';
                snow.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(snow);
            }
        }
        initSnow();

        // 2. 音效管理
        let musicActive = false;
        function toggleMusic() {
            const bgm = document.getElementById('bgm');
            const btn = document.getElementById('music-btn');
            if (musicActive) { bgm.pause(); btn.innerText = '🔇'; }
            else { bgm.play().catch(()=>{}); btn.innerText = '🎵'; }
            musicActive = !musicActive;
        }
        function playBubble() {
            const sfx = document.getElementById('bubble-sfx');
            sfx.currentTime = 0;
            sfx.play().catch(()=>{});
        }

        // 3. 物种数据 (16种)
        // stats维度: [智慧, 攻击力, 防御, 社交/深度]
        const species = {
            "orca": { name: "海洋街溜子 · 虎鲸", emoji: "🐋", desc: "你是精神状态极度领先的‘海洋霸总’。不仅智商绝顶，还热衷于在朋友圈拉帮结派，信条是：能群殴绝不单挑。", science: "高度社会化哺乳动物，有复杂的方言和文化。它们甚至会为了好玩而头顶死鱼，引领海洋时尚潮流。", class: "哺乳纲-海豚科", depth: "0-200m (表层)", stats: [95, 100, 80, 90] },
            "blobfish": { name: "深海摆烂王 · 水滴鱼", emoji: "🫠", desc: "你是究极避世爱好者。只要躺得够平，生活就没办法把你绊倒。对于内卷，你只有一句：随便吧，累了。", science: "由于生活在极高压环境下，它们没有肌肉和坚硬骨骼。离开深海后呈现的‘瘫软态’其实是由于减压造成的。", class: "杜父鱼科", depth: "600-1200m (深海)", stats: [30, 5, 20, 100] },
            "mantis": { name: "暴力艺术家 · 雀尾螳螂虾", emoji: "👊", desc: "性格极度外放的‘多巴胺配色’达人。不仅能看到别人看不见的色彩，还能打出别人承受不住的重拳。", science: "出拳瞬间产生的空泡能瞬间达到数千度，玻璃缸都能砸碎。这是生物界已知最快的攻击之一。", class: "软甲纲-口足目", depth: "1-40m (近海)", stats: [40, 100, 70, 20] },
            "octopus": { name: "多线CPU · 章鱼", emoji: "🐙", desc: "你是拥有九个大脑的智力型选手。擅长在复杂环境中瞬间切换人格，逃避现实你是专业的，且优雅。", science: "拥有三个心脏和九个大脑，其神经元大部分分布在触手中。能拧开瓶盖，甚至在实验室里‘越狱’。", class: "头足纲-八腕目", depth: "0-1000m (跨度大)", stats: [100, 60, 40, 50] },
            "mola": { name: "脆皮大学生 · 翻车鱼", emoji: "☀️", desc: "体型庞大却内心脆弱，稍微受惊就可能‘原地去世’。你活在这个世界上全靠概率论和好运气。", science: "一次产卵3亿枚，靠庞大的数量基数维持种群延续。常侧卧在海面晒太阳以吸引海鸟清理寄生虫。", class: "鲀形目-翻车鲀科", depth: "0-600m (中层)", stats: [20, 10, 10, 40] },
            "shark": { name: "孤独执行官 · 大白鲨", emoji: "🦈", desc: "高效、精准、独来独往。你必须不停游动以获取氧气，一旦停下来就会窒息，是个典型的行动派工作狂。", science: "并非‘杀人狂’，其嗅觉灵敏度极高。由于没有鳔，它们必须依靠持续游泳来保持浮力和呼吸。", class: "板鳃亚纲-鼠鲨目", depth: "0-1200m (广盐性)", stats: [60, 95, 75, 10] },
            "clownfish": { name: "海葵宅男 · 小丑鱼", emoji: "🐠", desc: "极度依赖‘舒适区’。外界的纷纷扰扰与你无关，你只想守着自己的一亩三分地，过安稳日子。", science: "与海葵互利共生。它们身体表面的粘液能防止海葵蜇伤，遇到危险时会迅速钻进海葵的毒刺丛中。", class: "辐鳍鱼纲-雀鲷科", depth: "1-15m (珊瑚礁)", stats: [50, 40, 85, 30] },
            "whale": { name: "温柔巨兽 · 蓝鲸", emoji: "🐋", desc: "拥有毁灭一切的力量，却选择温柔地过滤微小的磷虾。你的宽容和包容感让你在人群中拥有极高声望。", science: "地球史上最大的动物。其舌头可以站50个人，心脏有一辆小汽车那么大。低频叫声能传遍整个大洋。", class: "哺乳纲-须鲸亚目", depth: "0-500m (广布)", stats: [80, 30, 95, 40] },
            "jellyfish": { name: "虚幻艺术家 · 箱水母", emoji: "👾", desc: "空灵、优雅、且致命。你不需要大脑也能做出最精密的防御，不喜欢被触碰，边界感极强。", science: "拥有24只眼睛，其毒液可以在几分钟内让成年人心脏停跳。身体95%以上都是水，极其优雅。", class: "立方水母纲", depth: "0-50m (热带)", stats: [15, 90, 80, 5] },
            "seahorse": { name: "纯爱战神 · 海马", emoji: "🎠", desc: "浪漫主义者，节奏极慢。在急躁的现代海洋里，你宁愿勾住一根海草发呆，也不愿随波逐流。", science: "世界上唯一由雄性生育后代的动物。由于游泳能力差，它们主要靠预判和伪装来躲避掠食者。", class: "辐鳍鱼纲-海龙科", depth: "1-30m (浅海)", stats: [40, 15, 60, 30] },
            "eel": { name: "电力耗尽 · 电鳗", emoji: "⚡", desc: "平时看起来死气沉沉，一旦被激怒就会爆发惊人能量。爆发之后会陷入长久的‘贤者时间’。", science: "特化的肌肉组织能产生高达860伏特的电压。虽然叫鳗，但其实在分类上更接近鲶鱼。", class: "辐鳍鱼纲-电鳗目", depth: "0-20m (淡水近海)", stats: [45, 95, 30, 20] },
            "nudi": { name: "多巴胺画师 · 海蛞蝓", emoji: "🌈", desc: "海洋里的色彩天才。虽然爬得慢，但一定要美。靠颜值行走江湖，剧毒是你的底气和自信。", science: "会通过吃水螅来获取对方的毒素并储存在背部的触手里。是真正的‘吃什么变什么’的艺术家。", class: "腹足纲-裸鳃目", depth: "0-50m (底栖)", stats: [55, 60, 50, 40] },
            "crab": { name: "焦虑房奴 · 寄居蟹", emoji: "🐚", desc: "一生都在寻找更大的房子（壳）。虽然外表坚硬好斗，但脱掉壳的你其实是个极度柔软的小可爱。", science: "会排队交换空螺壳。如果找不到合适的螺壳，它们甚至会住在塑料盖或易拉罐里。", class: "软甲纲-异尾类", depth: "0-100m (潮间带)", stats: [50, 40, 95, 60] },
            "shrimp": { name: "极致打工人 · 清洁虾", emoji: "🦐", desc: "服务型人格天花板。喜欢帮‘大佬’清理牙缝，游走在各种危险关系之间，靠勤劳换取生存权。", science: "设立‘清洁站’，连凶猛的石斑鱼都会乖乖排队等它清理寄生虫，是海洋生态的医生。", class: "软甲纲-十脚目", depth: "10-50m (珊瑚礁)", stats: [65, 10, 20, 90] },
            "isopod": { name: "深海大强 · 大王具足虫", emoji: "🍱", desc: "生命力顽强得离谱。能五年不吃饭，只为等待一个降临的‘大瓜’。你是一个冷静的旁观者。", science: "等足目中体型最大的成员。由于深海食物匮乏，它们进化出了极慢的新陈代谢，是‘节约资源’的典范。", class: "软甲纲-等足目", depth: "170-2100m (深渊)", stats: [30, 40, 100, 10] },
            "squid": { name: "深渊克苏鲁 · 大王酸浆鱿", emoji: "🦑", desc: "生活在黑暗的极寒之地，拥有世界上最大的眼睛。你观察着一切，却从不轻易参与。神秘是你的代名词。", science: "生活在南极深海，眼睛直径可达30厘米。它们是抹香鲸唯一的竞争对手，拥有带钩的触手。", class: "头足纲-开眼亚目", depth: "2000m+ (午夜区)", stats: [70, 90, 50, 100] }
        };

        // 4. 20道测试题
        const questions = [
            { q: "早晨醒来发现自己漂浮在空荡荡的深海，你的第一反应是？", options: [
                { t: "太好了！没有社交，原地躺平", s: ["blobfish", "isopod"] },
                { t: "立刻发出长啸，寻找我的同类在哪里", s: ["orca", "whale"] },
                { t: "警惕四周，寻找最坚固的掩体", s: ["crab", "clownfish"] },
                { t: "开始计算寻找早餐的最优路径", s: ["octopus", "shark"] }
            ]},
            { q: "有个不长眼的鱼撞到了你的领地，你会？", options: [
                { t: "反手就是一个大逼兜，教TA做鱼", s: ["mantis", "orca"] },
                { t: "优雅地放个毒，让TA知道社会的险恶", s: ["jellyfish", "nudi"] },
                { t: "害羞地躲进壳里，假装家里没人", s: ["clownfish", "crab"] },
                { t: "礼貌询问：‘需要修个脚或者清理下牙缝吗？’", s: ["shrimp", "seahorse"] }
            ]},
            { q: "暗恋的对象路过，你的表现是？", options: [
                { t: "全身闪烁彩虹光芒，疯狂吸引注意力", s: ["nudi", "mantis"] },
                { t: "默默跟在后面，假装顺路其实在偷窥", s: ["squid", "octopus"] },
                { t: "带TA去吃最好的磷虾，走心不走头", s: ["whale", "orca"] },
                { t: "让TA帮我带孩子，这叫纯爱的信任", s: ["seahorse"] }
            ]},
            { q: "老板（大白鲨）在群里发了@所有人，你会？", options: [
                { t: "装死。只要我不回复，我就是海水", s: ["mola", "blobfish"] },
                { t: "秒回：‘收到，保证完成任务！’", s: ["shrimp", "clownfish"] },
                { t: "分析这条信息的深层含义和捕食陷阱", s: ["octopus", "shark"] },
                { t: "直接退群，去别的海域搞团建", s: ["orca"] }
            ]},
            { q: "面对人生的重大打击，你的崩溃方式是？", options: [
                { t: "原地裂开，或者干脆‘翻车’", s: ["mola", "blobfish"] },
                { t: "换个壳（房子/环境），重启鱼生", s: ["crab", "octopus"] },
                { t: "疯狂吐槽，直到整片海域都知道我的委屈", s: ["orca", "clownfish"] },
                { t: "潜入两千米深渊躲起来，五年不吃饭", s: ["isopod", "squid"] }
            ]},
            { q: "你的理想周末是如何度过的？", options: [
                { t: "去海面晒太阳发呆，什么也不干", s: ["mola", "whale"] },
                { t: "去热闹的珊瑚礁蹦迪，当全场焦点", s: ["orca", "mantis"] },
                { t: "躲在被窝里看恐怖片，寻找刺激", s: ["squid", "octopus"] },
                { t: "把家里打扫得一尘不染，甚至想帮邻居洗牙", s: ["shrimp", "seahorse"] }
            ]},
            { q: "你最希望拥有哪种超能力？", options: [
                { t: "物理无敌，一拳爆星", s: ["mantis", "shark"] },
                { t: "隐身术，世界与我无关", s: ["octopus", "jellyfish"] },
                { t: "永生，看尽沧海桑田", s: ["isopod", "whale"] },
                { t: "随时放电，把讨厌的人电晕", s: ["eel"] }
            ]},
            { q: "当别人质疑你的能力时，你通常？", options: [
                { t: "亮出毒刺或牙齿：‘你再说一遍？’", s: ["jellyfish", "shark"] },
                { t: "用复杂的理论和逻辑把TA绕晕", s: ["octopus", "whale"] },
                { t: "笑而不语，内心觉得TA是个土鳖", s: ["orca", "nudi"] },
                { t: "陷入自我怀疑：‘我真的这么废吗？’", s: ["blobfish", "mola"] }
            ]},
            { q: "你如何看待‘存钱’这件事？", options: [

        // 5. 核心逻辑
        let currentQ = 0;
        let scoreMap = {};
        Object.keys(species).forEach(k => scoreMap[k] = 0);

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQ];
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-depth').innerText = `DEPTH: ${currentQ * 50}M`;
            document.getElementById('q-percent').innerText = `${Math.round((currentQ / questions.length) * 100)}%`;
            document.getElementById('progress-bar').style.width = `${(currentQ / questions.length) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option w-full p-4 text-left rounded-2xl flex items-center gap-3 text-sm';
                btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-[10px] font-mono">${String.fromCharCode(65+i)}</span> ${opt.t}`;
                btn.onclick = () => {
                    playBubble();
                    opt.s.forEach(s => scoreMap[s] += 1);
                    currentQ++;
                    if (currentQ < questions.length) {
                        showQuestion();
                    } else {
                        showResult();
                    }
                };
                container.appendChild(btn);
            });
        }

        function showResult() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const winnerKey = Object.keys(scoreMap).reduce((a, b) => scoreMap[a] > scoreMap[b] ? a : b);
            const data = species[winnerKey];

            document.getElementById('fish-name').innerText = data.name;
            document.getElementById('fish-emoji').innerText = data.emoji;
            document.getElementById('fish-desc').innerText = data.desc;
            document.getElementById('fish-science').innerText = data.science;
            document.getElementById('fish-class').innerText = data.class;
            document.getElementById('fish-depth').innerText = data.depth;

            // 绘图
            const ctx = document.getElementById('radarChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['智慧', '攻击', '防御', '深度'],
                    datasets: [{
                        data: data.stats,
                        backgroundColor: 'rgba(0, 180, 216, 0.2)',
                        borderColor: '#00b4d8',
                        borderWidth: 2,
                        pointBackgroundColor: '#fff'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#888', font: { size: 10 } },
                            ticks: { display: false, max: 100, min: 0 }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        async function saveCard() {
            const card = document.getElementById('result-card');
            const canvas = await html2canvas(card, {
                scale: 3, // 超清
                backgroundColor: '#000814',
                useCORS: true
            });
            const link = document.createElement('a');
            link.download = `FishTI-Result-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
