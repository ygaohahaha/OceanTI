<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000814" />
  <title>OceanTI - 海洋精神状态发疯测试</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

    :root {
      --ocean-dark: #000814;
      --ocean-mid: #001d3d;
      --ocean-bright: #00b4d8;
    }

    html, body {
      background-color: var(--ocean-dark);
      color: #e0f2fe;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      margin: 0;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #marine-snow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .snow-particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      filter: blur(1px);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
      15% { opacity: 0.7; }
      100% { transform: translateY(110vh) translateX(30px); opacity: 0; }
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-option {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    .btn-option:active {
      background: rgba(0, 180, 216, 0.3);
      transform: scale(0.98);
    }

    .btn-option.selected {
      background: rgba(34, 211, 238, 0.22);
      border-color: rgba(34, 211, 238, 0.7);
      box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.15) inset;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .title-gradient {
      background: linear-gradient(90deg, #22d3ee, #818cf8, #22d3ee);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .hidden { display: none !important; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-4">
  <div id="marine-snow"></div>

  <div class="fixed top-6 right-6 z-50">
    <button type="button" onclick="toggleMusic()" id="music-btn" class="glass w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-lg">🔇</button>
  </div>

  <main class="w-full flex justify-center">
    <section id="start-screen" class="relative z-10 text-center max-w-sm flex flex-col h-[80vh] justify-center">
      <div class="flex-grow flex flex-col justify-center items-center">
        <div class="mb-6 inline-block animate-bounce text-7xl">🌊</div>
        <h1 class="text-7xl font-bold mb-2 tracking-tighter title-gradient" style="font-family: 'ZCOOL KuaiLe'">OceanTI</h1>
        <p class="text-blue-200 opacity-80 mb-12 tracking-[0.2em] text-xs font-bold">测一测你的海洋原型与发疯状态</p>
        <button type="button" onclick="startQuiz()" class="bg-cyan-500 hover:bg-cyan-400 text-white px-16 py-4 rounded-full text-xl font-bold shadow-[0_0_30px_rgba(6,182,212,0.4)] transition-all">潜入深海</button>
      </div>
      <div class="mt-auto pt-8">
        <p class="text-[10px] tracking-widest text-cyan-500/60 uppercase">制作团队：海洋五所</p>
      </div>
    </section>

    <section id="quiz-container" class="relative z-10 w-full max-w-lg hidden" aria-live="polite">
      <div class="mb-6">
        <div class="flex justify-between text-[10px] text-cyan-400 mb-2 uppercase font-mono tracking-widest font-bold">
          <span id="q-depth">DEPTH: 0M</span>
          <span>PROGRESS: <span id="q-percent">0%</span></span>
        </div>
        <div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-cyan-400 h-full transition-all duration-500 w-0"></div>
        </div>
      </div>

      <div class="glass rounded-3xl p-6 shadow-2xl border border-white/20">
        <h2 id="q-text" class="text-lg font-bold mb-6 leading-relaxed min-h-[80px] flex items-center text-white"></h2>
        <div id="options-container" class="space-y-3"></div>

        <div class="mt-6 grid grid-cols-2 gap-3">
          <button type="button" id="prev-btn" onclick="goPrev()" class="btn-nav py-3 rounded-2xl bg-white/10 hover:bg-white/15 text-sm font-bold transition-all">上一题</button>
          <button type="button" id="next-btn" onclick="goNext()" class="btn-nav py-3 rounded-2xl bg-cyan-600 hover:bg-cyan-500 text-sm font-bold transition-all">下一题</button>
        </div>
      </div>
    </section>

    <section id="result-screen" class="relative z-10 w-full max-w-lg hidden py-4">
      <div id="result-card" class="mx-auto p-8 rounded-[32px] border border-white/20 relative overflow-hidden bg-[#001d3d]">
        <div class="absolute -top-10 -right-10 p-4 opacity-5 text-[12rem] rotate-12 select-none">🫧</div>

        <div class="mb-6 relative z-10">
          <p class="text-[10px] tracking-[0.3em] text-cyan-400 uppercase opacity-70 mb-1 font-bold">Psychological Portrait</p>
          <div class="flex items-end justify-between border-b border-cyan-900/50 pb-4">
            <div>
              <h2 id="fish-name" class="text-3xl font-bold text-white tracking-tighter mb-2"></h2>
              <div id="fish-emoji" class="text-5xl pb-1"></div>
            </div>
            <img id="fish-image" src="" alt="species" class="w-24 h-24 object-cover rounded-xl border-2 border-cyan-400/50 shadow-[0_0_15px_rgba(34,211,238,0.3)] hidden" />
          </div>
        </div>

        <div class="mb-4 aspect-square max-w-[240px] mx-auto relative z-10">
          <canvas id="radarChart"></canvas>
        </div>

        <div class="space-y-4 mb-6 relative z-10">
          <div class="bg-cyan-400/10 p-4 rounded-2xl border-l-4 border-cyan-400">
            <p id="fish-desc" class="text-[13px] font-medium leading-relaxed text-blue-50 text-justify tracking-wide"></p>
          </div>
          <div class="bg-black/40 p-4 rounded-2xl border border-white/5">
            <p class="text-[10px] text-cyan-500 font-bold mb-1 tracking-widest uppercase">🧬 物种笔记</p>
            <p id="fish-science" class="text-[11px] text-blue-200/80 leading-relaxed text-justify"></p>
          </div>
        </div>

        <div class="flex justify-between items-end border-t border-white/10 pt-6 relative z-10">
          <div class="text-[9px] text-white/30 font-mono leading-tight">
            <p>GENUS: <span id="fish-class" class="text-white/60"></span></p>
            <p>HABITAT: <span id="fish-depth" class="text-white/60"></span></p>
            <p class="mt-2 uppercase tracking-tighter text-cyan-500/80 font-bold">制作团队：海洋五所</p>
          </div>
          <div class="text-right flex flex-col items-end">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://ygaohahaha.github.io/OceanTI/&bgcolor=001d3d&color=ffffff&margin=1" class="w-12 h-12 mb-2 border border-white/20 p-1 rounded-md" crossorigin="anonymous" alt="QR code" />
            <p class="text-[8px] opacity-40 font-bold tracking-wider">扫码潜入深海测发疯状态</p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mt-6 px-4">
        <button type="button" onclick="saveCard()" class="py-4 bg-cyan-600 hover:bg-cyan-500 rounded-2xl font-bold text-sm shadow-[0_4px_20px_rgba(6,182,212,0.3)] transition-all">保存发疯确诊单</button>
        <button type="button" onclick="location.reload()" class="py-4 bg-white/10 hover:bg-white/20 rounded-2xl font-bold text-sm transition-all">支付500，再来一次</button>
      </div>
    </section>
  </main>

  <audio id="bgm" loop src="./Tideglass.mp3"></audio>
  <audio id="bubble-sfx" src="https://assets.mixkit.co/sfx/preview/mixkit-liquid-bubble-3000.mp3"></audio>

  <script>
    const species = {
      orca: { name: "海洋街溜子 · 虎鲸", emoji: "🐋", image: "", desc: "确诊为：精神状态遥遥领先的极品霸总。你深谙职场与社交的厚黑学，智商极高且精力旺盛。对你来说，如果生活没有乐子，那就创造乐子（甚至把别人的痛苦当乐子）。你深知“能群殴绝不单挑”的真理，看似阳光开朗大男孩，实则切开全是黑的。海洋里只有你欺负别人的份，绝不内耗，只外耗别人！", science: "作为高度社会化的顶级掠食者，虎鲸拥有复杂的方言和文化传承。它们不仅会为了好玩把海豹当球踢、把海龟当飞盘，甚至还会流行“头顶一条死三文鱼”的非主流时尚。大脑中的情感结构比人类还要复杂。", class: "哺乳纲-海豚科", depth: "0-200m", stats: [95, 100, 80, 95] },
      blobfish: { name: "极致摆烂王 · 水滴鱼", emoji: "🫠", image: "", desc: "确诊为：深海重度躺平体验官。你对内卷有着生理性反胃，人生的终极奥义就是“算了”、“随便吧”、“毁灭吧”。只要躺得够平，资本的镰刀就割不到你。你平时看似毫无攻击性、软糯好捏，但一旦被迫离开你的“舒适区”，你会瞬间化作一滩史莱姆，用极度丧气的状态让试图强迫你的人感到深深的内疚。", science: "由于生活在极高压的深海，为了节省能量，水滴鱼连鱼鳔都没有，全身呈密度略小于水的凝胶状物质。只有在脱离高压深水被捕捞上岸后，它才会因为失压而瘫软成那张著名的“世界最丑动物”丧脸。", class: "辐鳍鱼纲-杜父鱼科", depth: "600-1200m", stats: [30, 5, 20, 100] },
      mantis: { name: "赛博格斗家 · 雀尾螳螂虾", emoji: "🥊", image: "", desc: "确诊为：暴躁易怒的色彩美学狂徒。你性格极度外放，眼里揉不得半点沙子。谁要是惹了你，你不用脑子思考，拳头会自动帮他清醒。你能在极短时间内爆发出惊人的行动力，且往往带有一种“虽然我很暴力，但我必须要好看”的执念。你是现实生活中的炸药包，不仅物理输出爆表，精神攻击也同样致命。", science: "能够看见多达16种原色（人类只有3种）。它的捕捉足出击速度高达每小时80公里，能在水下打出空穴效应，瞬间产生极其刺眼的闪光和上千度的高温，甚至能直接打碎水族馆的防弹玻璃。", class: "软甲纲-口足目", depth: "1-40m", stats: [40, 100, 70, 20] },
      octopus: { name: "多线程法师 · 章鱼", emoji: "🐙", image: "", desc: "确诊为：严重精分的千面间谍。你拥有一长串的内心戏和极其敏锐的观察力，能在复杂的职场和社交环境中瞬间切换人格。遇到麻烦时，你最擅长的就是“放个烟雾弹然后火速溜走”。你聪明得让人嫉妒，但这种过度的敏感也让你常常想远离人群，把自己塞进一个狭小的罐子里，享受绝对的独处。", science: "拥有3个心脏和9个大脑（1个主脑和8个分布式腕足神经中枢）。它们不仅能伪装成石头、海蛇，还能用触手独立思考并完成“拧开螺旋玻璃瓶盖”、“破解实验室迷宫”等离谱操作，被认为是地球上最像外星生物的物种。", class: "头足纲-八腕目", depth: "0-1000m", stats: [100, 60, 40, 50] },
      mola: { name: "脆皮大学生 · 翻车鱼", emoji: "🚑", image: "", desc: "确诊为：风一吹就散的惊吓易感人群。你活在这个世界上全靠概率论和好运气。内心极度脆弱，稍微遇到点风吹草动就想“原地去世”。你对生活的要求极低：别吓我，别撞我，让我安安静静晒个太阳就好。虽然总是处于精神崩溃的边缘，但你身上总有一种惹人怜爱的蠢萌感，让人不忍心欺负。", science: "骨骼退化且游泳能力极差，经常被洋流带着到处乱撞。它是世界上产卵最多的鱼类，一次能产下多达3亿枚卵，完全是靠变态般的数量基数硬抗大自然法则才没灭绝。常侧卧在海面上晒太阳以便海鸟清理寄生虫。", class: "鲀形目-翻车鲀科", depth: "0-600m", stats: [20, 10, 10, 40] },
      shark: { name: "冷血执行官 · 大白鲨", emoji: "🦈", image: "", desc: "确诊为：停下来就会死的行动派工作狂。你极度讨厌内耗，遇到问题永远是“别废话，直接干”。你享受孤独，喜欢独来独往，在团队中往往是那个力挽狂澜但懒得跟人交流的孤狼。别人觉得你高冷、可怕，其实你只是懒得把时间浪费在无意义的无效社交上，你只相信实力和效率。", science: "作为顶级掠食者，大白鲨没有鱼鳔，加上体内需要巨大的氧气消耗量，这意味着它必须保持一辈子都在不停地游动，一旦停下来就会因为窒息或沉底而死亡。可以说，它的强大是用“永不停歇”换来的。", class: "板鳃亚纲-鼠鲨目", depth: "0-1200m", stats: [60, 95, 75, 10] },
      clownfish: { name: "重度社恐宅 · 小丑鱼", emoji: "🏠", image: "", desc: "确诊为：脱离舒适区就会过敏的极度恋家狂。外面的世界对你来说太危险也太吵闹了，你只想一辈子苟在自己那片小小的海葵里。你的边界感极强，谁要是随便入侵你的私人空间，你会立刻炸毛。你把“好死不如赖活着”贯彻到了极致，是个能在混乱世界中找到专属于自己的苟活之道的生存大师。", science: "小丑鱼与海葵形成了完美的共生关系。它们身体表面的特殊黏液能让它免受海葵剧毒触手的蜇伤。遇到捕食者时，它们会立刻钻进毒刺丛中寻求庇护，连睡觉都不能离开海葵。", class: "辐鳍鱼纲-雀鲷科", depth: "1-15m", stats: [50, 40, 85, 30] },
      whale: { name: "温柔巨兽 · 蓝鲸", emoji: "🐳", image: "", desc: "确诊为：大格局的佛系老好人。你拥有碾压绝大多数人的实力，却偏偏选择做一个温柔的旁观者。你的宽容和包容感让你在人群中拥有极高声望，通常是朋友们的“情绪垃圾桶”。虽然你体型庞大、力量惊人，但你每天最大的烦恼往往是“今天去哪吃一顿饱饭”，是一种返璞归真的顶级精神状态。", science: "地球史上存在过的体积最大的动物，舌头重达3吨，可以站立50个人。尽管拥有如此恐怖的体型，它们却只吃体型微小的磷虾。它们发出的低频叫声能够穿透数千公里的海水，与其他同伴在深渊中交流。", class: "哺乳纲-须鲸亚目", depth: "0-500m", stats: [80, 30, 95, 40] },
      jellyfish: { name: "剧毒花瓶 · 箱水母", emoji: "👾", image: "", desc: "确诊为：没有脑子但极度致命的虚无主义者。空灵、优雅、边界感极强。你经常处于一种“放空”的状态，随波逐流是常态。但如果有人不知死活地想要碰瓷你，不好意思，哪怕你没带脑子出门，你的肌肉记忆也会让他付出惨痛的代价。主打一个“我很美，但我会克死你”。", science: "箱水母连真正的大脑都没有，却拥有极其复杂的24只眼睛和世界上最致命的神经毒素。其触手一旦接触到猎物，刺细胞会在几百万分之一秒内弹出，毒液能在几分钟内让人类心脏骤停。", class: "立方水母纲-立方水母目", depth: "0-50m", stats: [15, 90, 80, 5] },
      seahorse: { name: "纯爱发呆家 · 海马", emoji: "🎠", image: "", desc: "确诊为：节奏极慢的固执浪漫主义。在这个讲究效率和速度的内卷时代，你简直是一股清流。你宁愿一整天抱着一根草发呆，也不愿意为了合群而随波逐流。你认死理，对待感情专一到有些执拗，是个骨子里透着呆萌和忠诚的慢性子。", science: "世界上唯一一种由雄性负责怀孕和生育后代的动物。它们的游泳能力在鱼类中几乎垫底，为了不被洋流冲走，只能用灵活的尾巴死死勾住海草或珊瑚，一生中大部分时间都在原地发呆和等待猎物路过。", class: "辐鳍鱼纲-海龙科", depth: "1-30m", stats: [40, 15, 60, 30] },
      eel: { name: "情绪炸弹 · 电鳗", emoji: "⚡", image: "", desc: "确诊为：间歇性暴躁症患者。平时看着像个透明人，死气沉沉毫无波澜，别人甚至经常忘记你的存在。但只要有人踩了你的雷区，你会瞬间爆发出令人胆寒的能量，把周围人劈得外焦里嫩。不过，爆发完之后你会陷入长久的“贤者时间”，躲在角落里反思人生。", science: "拥有高度特化的肌肉组织，全身80%以上的体积由发电器官组成。最高能释放出高达860伏特的高压电。虽然名字叫鳗，但在分类学上它其实属于裸背电鳗目，血缘上反而离鲶鱼更近一些。", class: "辐鳍鱼纲-电鳗目", depth: "0-20m", stats: [45, 95, 30, 20] },
      nudi: { name: "多巴胺画师 · 海蛞蝓", emoji: "🌈", image: "", desc: "确诊为：用颜值杀人的自恋狂魔。对你来说，人生苦短，必须好看。哪怕爬得再慢、能力再差，出门也必须盛装打扮。你深谙“越美丽越危险”的道理，你的自信来源于你从别人那里“吸取”的底气。你是个极具艺术细胞的享乐主义者，靠着独特的个人魅力行走江湖。", science: "被称为“海神”的裸鳃类生物。它们本身往往没有防御能力，但它们会吃掉有毒的海绵或水螅，并把对方的毒刺细胞完好无损地转移到自己背上的突起中作为武器，是自然界真正的“拿来主义”大师。", class: "腹足纲-裸鳃目", depth: "0-50m", stats: [55, 60, 50, 40] },
      crab: { name: "焦虑房奴 · 寄居蟹", emoji: "🐚", image: "", desc: "确诊为：缺乏安全感的武装刺猬。你一生都在不停地寻找更大的“房子”（壳），物质基础是你唯一的安全感来源。虽然在外人看来你张牙舞爪、全副武装、一言不合就开干，但实际上你极其害怕受伤，一旦被人掀掉伪装，你比谁都要柔软和恐慌。", science: "腹部柔软且不对称，必须终生寄居在空螺壳内。它们对房地产有着疯狂的执念，甚至会像人类一样排队交换空壳。如果在污染海域找不到贝壳，它们甚至只能绝望地住进人类丢弃的塑料瓶盖或玻璃瓶里。", class: "软甲-十足目", depth: "0-100m", stats: [50, 40, 95, 60] },
      shrimp: { name: "极致打工人 · 清洁虾", emoji: "🦐", image: "", desc: "确诊为：职场讨好型服务天花板。你游走在各种大佬和危险关系之间，靠着极高的情商和勤劳的双手换取生存权。你见人说人话，见鬼说鬼话，总能精准找到对方的痛点并提供情绪价值（或者物理清理）。虽然卑微，但你实际上掌握着整个圈子的核心八卦。", science: "会在珊瑚礁上设立固定的“清洁站”。它们不仅能在凶猛海鳝的牙缝里跳舞，连顶级掠食者石斑鱼路过时，也会张开大嘴乖乖排队等它清理寄生虫，是海洋生态链中受万鱼敬仰的“华佗”。", class: "软甲纲-十脚目", depth: "10-50m", stats: [65, 10, 20, 90] },
      isopod: { name: "断食修仙者 · 大王具足虫", emoji: "🍱", image: "", desc: "确诊为：熬死所有人的深海老神仙。生命力顽强得让人发指。你不卷、不争、不抢，就静静地在深海的黑暗中等待天上掉馅饼（死鲸鱼）。对你来说，时间没有意义，你是个极其冷静的旁观者，在别的鱼为了资源打得头破血流时，你只在旁边默默说一句：“不急，我能苟。”", science: "作为深海最大的等足目动物，由于海底资源极度匮乏，它们进化出了自然界最慢的新陈代谢系统之一。日本水族馆的一只大王具足虫曾创下绝食5年零43天才死亡的惊人纪录，是名副其实的节流大师。", class: "软甲纲-等足目", depth: "170-2100m", stats: [30, 40, 100, 10] },
      squid: { name: "深渊克苏鲁 · 大王酸浆鱿", emoji: "🦑", image: "", desc: "确诊为：活在黑暗里的神秘大BOSS。你极其神秘，很少主动露面，但江湖上永远流传着你的传说。你长着一双看透一切的巨大眼睛，冷眼旁观着世界的荒诞。只有在面对真正的宿敌时，你才会展现出恐怖的真实实力。孤独是你最大的铠甲。", science: "生活在两千米深的南极冰冷深渊，拥有世界上最大的眼睛（如同排球一般大）用来在黑暗中捕捉微光。它的触手上长满了可360度旋转的倒钩，是深海霸主抹香鲸一生中唯一的也是最致命的死敌。", class: "头足纲-开眼鱿目", depth: "2000m+", stats: [70, 90, 50, 100] }
    };

        { t: "别动我，让我安静地烂在海底，这就是最好的归宿。", s: ["blobfish", "isopod", "mola", "whale"] },
        { t: "只要能让我每天美美地发疯，我就还能继续活下去。", s: ["nudi", "jellyfish", "octopus", "squid"] },
        { t: "医生！我觉得我还能抢救！只要给我个好点的贝壳就行！", s: ["crab", "clownfish", "shrimp", "seahorse"] }
      ]}
    ];

    let currentQ = 0;
    let scoreMap = {};
    let answers = [];
    let musicActive = false;
    let radarChartInstance = null;

    function initSnow() {
      const container = document.getElementById('marine-snow');
      container.innerHTML = '';
      for (let i = 0; i < 40; i++) {
        const snow = document.createElement('div');
        snow.className = 'snow-particle';
        const size = (Math.random() * 3 + 1) + 'px';
        snow.style.width = size;
        snow.style.height = size;
        snow.style.left = Math.random() * 100 + '%';
        snow.style.animationDuration = (Math.random() * 10 + 8) + 's';
        snow.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(snow);
      }
    }

    function initScoreMap() {
      scoreMap = {};
      Object.keys(species).forEach(k => scoreMap[k] = 0);
    }

    function getProgressRatio() {
      return questions.length > 1 ? currentQ / (questions.length - 1) : 1;
    }

    function applyChoice(questionIndex, optionIndex, direction) {
      const choice = questions[questionIndex]?.options?.[optionIndex];
      if (!choice) return;
      choice.s.forEach(key => {
        scoreMap[key] += direction;
      });
    }

    function updateNavButtons() {
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      if (!prevBtn || !nextBtn) return;

      prevBtn.disabled = currentQ === 0;
      nextBtn.disabled = answers[currentQ] === null;
      nextBtn.innerText = currentQ === questions.length - 1 ? '查看结果' : '下一题';
    }

    function toggleMusic() {
      const bgm = document.getElementById('bgm');
      const btn = document.getElementById('music-btn');
      if (musicActive) {
        bgm.pause();
        btn.innerText = '🔇';
      } else {
        bgm.play().catch(() => {});
        btn.innerText = '🎵';
      }
      musicActive = !musicActive;
    }

    function playBubble() {
      const sfx = document.getElementById('bubble-sfx');
      sfx.currentTime = 0;
      sfx.play().catch(() => {});
    }

    function startQuiz() {
      playBubble();

      const bgm = document.getElementById('bgm');
      if (!musicActive) {
        bgm.play().catch(() => {});
        document.getElementById('music-btn').innerText = '🎵';
        musicActive = true;
      }

      initScoreMap();
      answers = Array(questions.length).fill(null);
      currentQ = 0;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-container').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQ];
      const progress = getProgressRatio();

      document.getElementById('q-text').innerText = q.q;
      document.getElementById('q-depth').innerText = `DEPTH: ${currentQ * 50}M`;
      document.getElementById('q-percent').innerText = `${Math.round(progress * 100)}%`;
      document.getElementById('progress-bar').style.width = `${progress * 100}%`;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-option w-full p-4 rounded-2xl flex items-center gap-3 text-sm';
        if (answers[currentQ] === i) btn.classList.add('selected');
        btn.innerHTML = `<span class="w-6 h-6 shrink-0 rounded-full bg-cyan-400/20 text-cyan-400 flex items-center justify-center text-[10px] font-mono font-bold">${String.fromCharCode(65 + i)}</span><span class="leading-relaxed">${opt.t}</span>`;
        btn.onclick = () => {
          selectOption(i);
        };
        container.appendChild(btn);
      });

      updateNavButtons();
    }

    function selectOption(optionIndex) {
      const prev = answers[currentQ];
      if (prev !== null) {
        applyChoice(currentQ, prev, -1);
      }
      answers[currentQ] = optionIndex;
      applyChoice(currentQ, optionIndex, 1);
      if (currentQ < questions.length - 1) {
        currentQ += 1;
        showQuestion();
      } else {
        showResult();
      }
    }

    function goPrev() {
      if (currentQ === 0) return;
      currentQ -= 1;
      showQuestion();
    }

    function goNext() {
      if (answers[currentQ] === null) return;
      if (currentQ < questions.length - 1) {
        currentQ += 1;
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-container').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      const winnerKey = Object.keys(scoreMap).reduce((a, b) => {
        if (scoreMap[a] > scoreMap[b]) return a;
        if (scoreMap[a] < scoreMap[b]) return b;
        return a;
      });

      const data = species[winnerKey];
      document.getElementById('fish-name').innerText = data.name;
      document.getElementById('fish-desc').innerText = data.desc;
      document.getElementById('fish-science').innerText = data.science;
      document.getElementById('fish-class').innerText = data.class;
      document.getElementById('fish-depth').innerText = data.depth;

      const fishEmoji = document.getElementById('fish-emoji');
      const fishImage = document.getElementById('fish-image');
      if (data.image && data.image.trim() !== '') {
        fishImage.src = data.image;
        fishImage.classList.remove('hidden');
        fishEmoji.classList.add('hidden');
      } else {
        fishImage.classList.add('hidden');
        fishEmoji.classList.remove('hidden');
        fishEmoji.innerText = data.emoji;
      }

      if (radarChartInstance) radarChartInstance.destroy();
      const ctx = document.getElementById('radarChart').getContext('2d');
      radarChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['发疯指数', '物理武力', '心理防御', '精神稳定'],
          datasets: [{
            data: data.stats,
            backgroundColor: 'rgba(34, 211, 238, 0.2)',
            borderColor: '#22d3ee',
            borderWidth: 2,
            pointBackgroundColor: '#fff',
            pointRadius: 2,
            pointHoverRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          scales: {
            r: {
              angleLines: { color: 'rgba(255,255,255,0.1)' },
              grid: { color: 'rgba(255,255,255,0.1)' },
              pointLabels: { color: '#e0f2fe', font: { size: 10, family: 'sans-serif', weight: 'bold' } },
              ticks: { display: false, max: 100, min: 0 }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    async function saveCard() {
      const card = document.getElementById('result-card');
      if (typeof html2canvas === 'undefined') {
        alert('html2canvas 未加载成功，请检查网络。');
        return;
      }

      card.style.height = 'auto';
      const canvas = await html2canvas(card, {
        scale: 3,
        backgroundColor: '#001d3d',
        useCORS: true,
        allowTaint: true
      });

      const link = document.createElement('a');
      link.download = `OceanTI-发疯报告-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initSnow();
      initScoreMap();
      answers = Array(questions.length).fill(null);
      document.getElementById('quiz-container').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
    });
  </script>
</body>
</html>
