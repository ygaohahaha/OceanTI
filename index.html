<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OceanTI - 海洋精神状态发疯测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        
        :root {
            --ocean-dark: #000814;
            --ocean-mid: #001d3d;
            --ocean-bright: #00b4d8;
        }

        body {
            background-color: var(--ocean-dark);
            color: #e0f2fe;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #marine-snow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .snow-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(1px);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
            100% { transform: translateY(110vh) translateX(30px); opacity: 0; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-option {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }

        .btn-option:active {
            background: rgba(0, 180, 216, 0.3);
            transform: scale(0.98);
        }

        .title-gradient {
            background: linear-gradient(90deg, #22d3ee, #818cf8, #22d3ee);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .hidden { display: none !important; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div id="marine-snow"></div>

    <div class="fixed top-6 right-6 z-50">
        <button onclick="toggleMusic()" id="music-btn" class="glass w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-lg">🔇</button>
    </div>

    <!-- 开始界面 -->
    <div id="start-screen" class="relative z-10 text-center max-w-sm">
        <div class="mb-6 inline-block animate-bounce text-7xl">🥨</div>
        <h1 class="text-7xl font-bold mb-2 tracking-tighter title-gradient" style="font-family: 'ZCOOL KuaiLe'">FishTI</h1>
        <p class="text-blue-200 opacity-80 mb-12 tracking-[0.2em] text-xs font-bold">测一测你的深海原型与精神状态</p>
        <button onclick="startQuiz()" class="bg-cyan-500 hover:bg-cyan-400 text-white px-16 py-4 rounded-full text-xl font-bold shadow-[0_0_30px_rgba(6,182,212,0.4)] transition-all">潜入深海</button>
    </div>

    <!-- 答题界面 -->
    <div id="quiz-container" class="relative z-10 w-full max-w-lg hidden">
        <div class="mb-6">
            <div class="flex justify-between text-[10px] text-cyan-400 mb-2 uppercase font-mono tracking-widest font-bold">
                <span id="q-depth">DEPTH: 0M</span>
                <span>PROGRESS: <span id="q-percent">0%</span></span>
            </div>
            <div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-cyan-400 h-full transition-all duration-500 w-0"></div>
            </div>
        </div>
        
        <div class="glass rounded-3xl p-6 shadow-2xl border border-white/20">
            <h2 id="q-text" class="text-lg font-bold mb-6 leading-relaxed min-h-[80px] flex items-center text-white"></h2>
            <div id="options-container" class="space-y-3"></div>
        </div>
    </div>

    <!-- 结果界面 -->
    <div id="result-screen" class="relative z-10 w-full max-w-lg hidden py-4">
        <div id="result-card" class="mx-auto p-8 rounded-[32px] border border-white/20 relative overflow-hidden bg-[#001d3d]">
            <div class="absolute -top-10 -right-10 p-4 opacity-5 text-[12rem] rotate-12 select-none">🌊</div>
            
            <div class="mb-6 relative z-10">
                <p class="text-[10px] tracking-[0.3em] text-cyan-400 uppercase opacity-70 mb-1 font-bold">Psychological Portrait</p>
                <div class="flex items-end justify-between border-b border-cyan-900/50 pb-4">
                    <h2 id="fish-name" class="text-3xl font-bold text-white tracking-tighter"></h2>
                    <div id="fish-emoji" class="text-5xl pb-1"></div>
                </div>
            </div>

            <div class="mb-4 aspect-square max-w-[240px] mx-auto relative z-10">
                <canvas id="radarChart"></canvas>
            </div>

            <div class="space-y-4 mb-6 relative z-10">
                <div class="bg-cyan-400/10 p-4 rounded-2xl border-l-4 border-cyan-400">
                    <p id="fish-desc" class="text-sm font-medium leading-relaxed text-blue-50"></p>
                </div>
                <div class="bg-black/40 p-4 rounded-2xl border border-white/5">
                    <p class="text-[10px] text-cyan-500 font-bold mb-1 tracking-widest uppercase">🧬 演化心理笔记</p>
                    <p id="fish-science" class="text-xs text-blue-200/70 leading-relaxed"></p>
                </div>
            </div>

            <div class="flex justify-between items-end border-t border-white/10 pt-6 relative z-10">
                <div class="text-[9px] text-white/30 font-mono leading-tight">
                    <p>GENUS: <span id="fish-class" class="text-white/60"></span></p>
                    <p>HABITAT: <span id="fish-depth" class="text-white/60"></span></p>
                    <p class="mt-2 uppercase tracking-tighter">Certified by FishTI Psycho-Lab</p>
                </div>
                <div class="text-right">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=FishTI&bgcolor=001d3d&color=ffffff" class="w-10 h-10 ml-auto mb-1 border border-white/20 p-1">
                    <p class="text-[8px] opacity-30">扫码测测你的灵魂物种</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-6 px-4">
            <button onclick="saveCard()" class="py-4 bg-cyan-600 hover:bg-cyan-500 rounded-2xl font-bold text-sm shadow-xl transition-all">保存报告</button>
            <button onclick="location.reload()" class="py-4 bg-white/10 hover:bg-white/20 rounded-2xl font-bold text-sm transition-all">500，再来一次</button>
        </div>
    </div>

    <audio id="bgm" loop src="https://assets.mixkit.co/music/preview/mixkit-underwater-world-983.mp3"></audio>
    <audio id="bubble-sfx" src="https://assets.mixkit.co/sfx/preview/mixkit-liquid-bubble-3000.mp3"></audio>

    <script>
        // 1. 初始化背景
        function initSnow() {
            const container = document.getElementById('marine-snow');
            for (let i = 0; i < 40; i++) {
                const snow = document.createElement('div');
                snow.className = 'snow-particle';
                const size = Math.random() * 3 + 1 + 'px';
                snow.style.width = size;
                snow.style.height = size;
                snow.style.left = Math.random() * 100 + '%';
                snow.style.animationDuration = Math.random() * 10 + 8 + 's';
                snow.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(snow);
            }
        }
        initSnow();

        // 2. 音效管理
        let musicActive = false;
        function toggleMusic() {
            const bgm = document.getElementById('bgm');
            const btn = document.getElementById('music-btn');
            if (musicActive) { bgm.pause(); btn.innerText = '🔇'; }
            else { bgm.play().catch(()=>{}); btn.innerText = '🎵'; }
            musicActive = !musicActive;
        }
        function playBubble() {
            const sfx = document.getElementById('bubble-sfx');
            sfx.currentTime = 0;
            sfx.play().catch(()=>{});
        }

        // 3. 物种数据
        const species = {
            "orca": { name: "海洋霸总 · 虎鲸", emoji: "🐋", desc: "你是精神状态领先全海洋的顶级大佬。智商高、体力好，最重要的是深谙社交精髓：能群殴绝不单挑！", science: "高度社会化的霸主，有方言甚至文化。它们会为了好玩去调戏海豹，甚至头顶死鱼引发时尚潮流。", class: "哺乳纲-海豚科", depth: "0-200m", stats: [95, 100, 80, 90] },
            "blobfish": { name: "深海摆烂王 · 水滴鱼", emoji: "🫠", desc: "你是究极避世爱好者。只要躺得够平，生活就没办法把你绊倒。对于内卷，你只有一句：随便吧，累了。", science: "由于生活在极高压下，全身呈凝胶状。离开水后因为失压呈现出的‘瘫软态’，意外成了互联网丧文化的图腾。", class: "杜父鱼科", depth: "600-1200m", stats: [30, 5, 20, 100] },
            "mantis": { name: "暴力艺术家 · 雀尾螳螂虾", emoji: "👊", desc: "性格极度外放的暴力美学达人。不仅能看到别人看不见的色彩，还能打出别人承受不住的重拳。", science: "出拳瞬间产生的空泡能产生数千度高温。玻璃缸都能砸碎，它是生物界已知最快的攻击者之一。", class: "软甲纲-口足目", depth: "1-40m", stats: [40, 100, 70, 20] },
            "octopus": { name: "多线CPU · 章鱼", emoji: "🐙", desc: "你是拥有九个大脑的智力型选手。擅长在复杂环境中瞬间切换人格，逃避现实你是专业的。", science: "拥有三个心脏和九个大脑，其神经元大部分分布在触手中。能拧瓶盖、甚至在实验室上演‘越狱’。", class: "头足纲-八腕目", depth: "0-1000m", stats: [100, 60, 40, 50] },
            "mola": { name: "脆皮大学生 · 翻车鱼", emoji: "☀️", desc: "体型庞大却内心脆弱，稍微受惊就可能‘原地去世’。你活在这个世界上全靠概率论和好运气。", science: "一次产卵3亿枚，靠数量基数维持种群。常侧卧在海面晒太阳，以此吸引海鸟帮它清理寄生虫。", class: "鲀形目-翻车鲀科", depth: "0-600m", stats: [20, 10, 10, 40] },
            "shark": { name: "孤独执行官 · 大白鲨", emoji: "🦈", desc: "高效、精准、独来独往。你必须不停游动以获取氧气，一旦停下来就会窒息，典型的行动派。", science: "由于没有鳔，必须靠持续游泳来保持浮力和呼吸。这种‘停不下来’的特征决定了它们的高效。", class: "板鳃亚纲-鼠鲨目", depth: "0-1200m", stats: [60, 95, 75, 10] },
            "clownfish": { name: "海葵宅男 · 小丑鱼", emoji: "🐠", desc: "极度依赖‘舒适区’。外界的纷纷扰扰与你无关，你只想守着自己的一亩三分地，过安稳日子。", science: "与海葵互利共生，身体表面的粘液能防止蜇伤。遇到危险会迅速钻进毒刺丛中，安全感至上。", class: "辐鳍鱼纲-雀鲷科", depth: "1-15m", stats: [50, 40, 85, 30] },
            "whale": { name: "温柔巨兽 · 蓝鲸", emoji: "🐋", desc: "拥有毁灭一切的力量，却选择温柔。你的宽容和包容感让你在人群中拥有极高声望。", science: "地球史上最大的动物。其舌头可以站50个人，心脏有一辆小汽车那么大。低频叫声能传遍整个大洋。", class: "哺乳纲-须鲸亚目", depth: "0-500m", stats: [80, 30, 95, 40] },
            "jellyfish": { name: "虚幻艺术家 · 箱水母", emoji: "👾", desc: "空灵、优雅、且致命。你不需要大脑也能做出最精密的防御，边界感极强，不喜欢被触碰。", science: "拥有24只眼睛，其毒液可以在几分钟内让人心脏停跳。身体95%以上都是水，优雅到极致。", class: "立方水母纲", depth: "0-50m", stats: [15, 90, 80, 5] },
            "seahorse": { name: "纯爱战神 · 海马", emoji: "🎠", desc: "浪漫主义者，节奏极慢。在急躁的现代海洋里，你宁愿勾住一根海草发呆，也不愿随波逐流。", science: "世界上唯一由雄性生育后代的动物。由于游泳能力差，它们主要靠精密的伪装和预判来生存。", class: "辐鳍鱼纲-海龙科", depth: "1-30m", stats: [40, 15, 60, 30] },
            "eel": { name: "电力耗尽 · 电鳗", emoji: "⚡", desc: "平时看起来死气沉沉，一旦被激怒就会爆发惊人能量。爆发之后会陷入长久的‘贤者时间’。", science: "特化的肌肉组织能产生高达860伏特的电压。虽然叫鳗，但在分类上更接近鲶鱼。", class: "辐鳍鱼纲-电鳗目", depth: "0-20m", stats: [45, 95, 30, 20] },
            "nudi": { name: "多巴胺画师 · 海蛞蝓", emoji: "🌈", desc: "海洋里的色彩天才。虽然爬得慢，但一定要美。靠颜值行走江湖，剧毒是你的底气。", science: "会通过吃水螅来获取对方的毒素并储存在背部的触手里。是真正的‘吃什么变什么’的艺术家。", class: "腹足纲-裸鳃目", depth: "0-50m", stats: [55, 60, 50, 40] },
            "crab": { name: "焦虑房奴 · 寄居蟹", emoji: "🐚", desc: "一生都在寻找更大的房子（壳）。虽然外表坚硬好斗，但脱掉壳的你其实是个极度柔软的小可爱。", science: "会排队交换空螺壳。如果找不到合适的壳，它们甚至会住在塑料盖或易拉罐里。", class: "软甲纲-异尾类", depth: "0-100m", stats: [50, 40, 95, 60] },
            "shrimp": { name: "极致打工人 · 清洁虾", emoji: "🦐", desc: "服务型人格天花板。喜欢帮‘大佬’清理牙缝，游走在各种危险关系之间，靠勤劳换取生存权。", science: "设立‘清洁站’，连凶猛的石斑鱼都会乖乖排队等它清理寄生虫，是海洋生态的医生。", class: "软甲纲-十脚目", depth: "10-50m", stats: [65, 10, 20, 90] },
            "isopod": { name: "深海大强 · 大王具足虫", emoji: "🍱", desc: "生命力顽强得离谱。能五年不吃饭，只为等待一个降临的‘大瓜’。你是一个冷静的旁观者。", science: "由于深海食物匮乏，它们进化出了极慢的新陈代谢，能忍受长时间的饥饿。", class: "软甲纲-等足目", depth: "170-2100m", stats: [30, 40, 100, 10] },
            "squid": { name: "深渊克苏鲁 · 大王酸浆鱿", emoji: "🦑", desc: "生活在黑暗的极寒之地，拥有世界上最大的眼睛。你观察着一切，却从不轻易参与。神秘、强大、孤独。", science: "生活在南极深海，眼睛直径可达30厘米。是抹香鲸唯一的对手，拥有带钩的触手。", class: "头足纲-开眼亚目", depth: "2000m+", stats: [70, 90, 50, 100] }
        };

        // 4. 发疯版20道题目
        const questions = [
            { q: "Q1：当一艘渔船轰隆隆地开过来，甚至撒下大网，你的第一反应是？", options: [
                { t: "赶紧一个神龙摆尾游走，保命要紧。", s: ["shark", "clownfish", "crab"] },
                { t: "一个旱地拔葱跳上甲板，给渔夫一个响亮的大逼兜。", s: ["mantis", "orca", "eel"] },
                { t: "假装自己是海水，嘴里发出‘咕嘟’声试图蒙混过关。", s: ["blobfish", "octopus", "jellyfish"] },
                { t: "游到网边：‘家人们谁懂啊，这里有免费电梯！’", s: ["shrimp", "seahorse", "mola"] }
            ]},
            { q: "Q2：今天海底派对开幕了，有很多五颜六色的鱼，你会怎么做？", options: [
                { t: "找个海葵缝钻进去，只要看不见别人，别人就看不见我。", s: ["clownfish", "crab", "isopod"] },
                { t: "在场中央疯狂吐泡泡，今天我就是这片海域最亮的崽！", s: ["orca", "mantis", "nudi"] },
                { t: "趴在角落的地板上，假装自己是一块会呼吸的抹布。", s: ["blobfish", "mola"] },
                { t: "偷偷游到别人背后，拔掉人家最好看的一片鳞然后火速逃跑。", s: ["orca", "eel"] }
            ]},
            { q: "Q3：洋流把你往未知的深海冲去，此时你：", options: [
                { t: "逆流而上！只要我游得够快，命运就追不上我！", s: ["shark", "orca"] },
                { t: "太好了省力了，翻个面闭上眼，就当免费旅游了。", s: ["blobfish", "mola", "whale"] },
                { t: "张大嘴巴，顺便把路过被冲过来的浮游生物全吃掉。", s: ["whale", "isopod"] },
                { t: "立刻死死吸住路过的一只大海龟：‘带我一个！’", s: ["shrimp", "seahorse", "clownfish"] }
            ]},
            { q: "Q4：老板（大白鲨）突然在群里艾特你，让你周末回海里加班？", options: [
                { t: "秒回：‘好的老板，正好我还没睡。’（其实在磨牙）", s: ["shrimp", "clownfish"] },
                { t: "反手就是一个‘消息撤回’，然后注销账号假装查无此鱼。", s: ["octopus", "squid"] },
                { t: "游到老板身边放出一股强电流，让他知道什么叫‘薪火相传’。", s: ["eel", "mantis"] },
                { t: "太紧张导致鱼鳔失衡，直接原地翻车漂浮在海面。", s: ["mola", "blobfish"] }
            ]},
            { q: "Q5：你发现暗恋的鱼正在和别的鱼共舞，你会？", options: [
                { t: "优雅地路过并喷出一团墨汁，让大家都别想看清谁是谁。", s: ["octopus", "squid"] },
                { t: "在旁边疯狂跳科目三，试图用抽象的舞姿夺回对方的注意。", s: ["orca", "nudi"] },
                { t: "默默回家吃五公斤磷虾，化悲愤为食欲。", s: ["whale", "shark"] },
                { t: "把自己颜色调到最亮，亮瞎这对苦命鸳鸯。", s: ["jellyfish", "nudi"] }
            ]},
            { q: "Q6：如果你可以拥有一种超能力，你选？", options: [
                { t: "一拳打穿海底地壳的怪力。", s: ["mantis", "shark"] },
                { t: "随时随地瞬间移动，瞬移到被窝里。", s: ["octopus", "isopod"] },
                { t: "五年不吃不喝还不掉秤的耐力。", s: ["isopod", "blobfish"] },
                { t: "唱歌能传遍半个地球的巨肺。", s: ["whale", "orca"] }
            ]},
            { q: "Q7：面对一只比你大十倍的掠食者，你通常的防御手段是？", options: [
                { t: "亮出剧毒：‘碰我一下试试，头七都不用过。’", s: ["jellyfish", "nudi"] },
                { t: "把自己缩成一个坚硬的球，主打一个‘咬不动’。", s: ["crab", "isopod"] },
                { t: "哭。哭得很大声，直到对方觉得没面子走掉。", s: ["mola", "clownfish"] },
                { t: "大声喊人：‘家人们救命啊，这有人欺负老实鱼啦！’", s: ["orca", "shrimp"] }
            ]},
            { q: "Q8：在海底捡到了一颗发光的珍珠，你会？", options: [
                { t: "卖掉。换一整年的顶级海藻套餐。", s: ["shark", "crab"] },

            ]}
        ];

        // 5. 逻辑脚本
        let currentQ = 0;
        let scoreMap = {};
        Object.keys(species).forEach(k => scoreMap[k] = 0);

        function startQuiz() {
            playBubble();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQ];
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-depth').innerText = `DEPTH: ${currentQ * 50}M`;
            document.getElementById('q-percent').innerText = `${Math.round((currentQ / questions.length) * 100)}%`;
            document.getElementById('progress-bar').style.width = `${(currentQ / questions.length) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option w-full p-4 rounded-2xl flex items-center gap-3 text-sm';
                btn.innerHTML = `<span class="w-6 h-6 shrink-0 rounded-full bg-cyan-400/20 text-cyan-400 flex items-center justify-center text-[10px] font-mono font-bold">${String.fromCharCode(65+i)}</span> ${opt.t}`;
                btn.onclick = () => {
                    playBubble();
                    opt.s.forEach(s => scoreMap[s] += 1);
                    currentQ++;
                    if (currentQ < questions.length) {
                        showQuestion();
                    } else {
                        showResult();
                    }
                };
                container.appendChild(btn);
            });
        }

        function showResult() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const winnerKey = Object.keys(scoreMap).reduce((a, b) => scoreMap[a] > scoreMap[b] ? a : b);
            const data = species[winnerKey];

            document.getElementById('fish-name').innerText = data.name;
            document.getElementById('fish-emoji').innerText = data.emoji;
            document.getElementById('fish-desc').innerText = data.desc;
            document.getElementById('fish-science').innerText = data.science;
            document.getElementById('fish-class').innerText = data.class;
            document.getElementById('fish-depth').innerText = data.depth;

            const ctx = document.getElementById('radarChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['智慧', '武力', '防御', '心态'],
                    datasets: [{
                        data: data.stats,
                        backgroundColor: 'rgba(34, 211, 238, 0.2)',
                        borderColor: '#22d3ee',
                        borderWidth: 2,
                        pointBackgroundColor: '#fff',
                        pointRadius: 0
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#888', font: { size: 10 } },
                            ticks: { display: false, max: 100, min: 0 }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        async function saveCard() {
            const card = document.getElementById('result-card');
            const canvas = await html2canvas(card, {
                scale: 3,
                backgroundColor: '#000814',
                useCORS: true
            });
            const link = document.createElement('a');
            link.download = `FishTI-Result-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
